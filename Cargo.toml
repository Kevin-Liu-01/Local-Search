[package]
name = "local-search"
version = "0.1.4"
edition = "2024"
autobins = false
description = "A local browser API for agents: search, read, extract, and use Chrome sessions"
license = "MIT"
repository = "https://github.com/Kevin-Liu-01/local-search"
homepage = "https://lsearch.dev"
readme = "README.md"
exclude = [
  ".agent-docs/",
  ".github/",
  ".gitignore",
  "AGENTS.md",
  "assets/",
  "benchmarks/",
  "npm/",
  "scripts/",
  "site/",
]
keywords = ["search", "browser", "agents", "cdp", "scraping"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "lsearch"
path = "src/bin/lsearch.rs"

[[bin]]
name = "local-search"
path = "src/bin/local-search.rs"

[[bin]]
name = "local-browser"
path = "src/bin/local-browser.rs"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["now", "std"] }
clap = { version = "4.6.2", default-features = false, features = ["derive", "env", "error-context", "help", "std", "suggestions", "usage"] }
dirs = "6.0.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
http = "1.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.26.0"

[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
unsafe-code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
pedantic = { level = "warn", priority = 3 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
