<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">local-search — structured browser search for coding agents</title>
  <desc id="desc">A light technical banner showing the local-search Rust CLI returning compact structured JSON through a local browser, with no API key or metered search bill.</desc>
  <defs>
    <pattern id="dot-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#168B90" fill-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F5F5F2"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>
  <rect x="40.5" y="40.5" width="1119" height="549" rx="2" fill="#FFFFFF" fill-opacity=".34" stroke="#D7D7D1"/>
  <path d="M630.5 104V559" stroke="#D7D7D1"/>

  <g stroke="#6F6F69" stroke-opacity=".68">
    <path d="M31 40.5H50M40.5 31V50M1150 40.5H1169M1159.5 31V50M31 589.5H50M40.5 580V599M1150 589.5H1169M1159.5 580V599"/>
  </g>

  <g transform="translate(76 126) scale(1.12)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4 1h54l-2 7 7 5-4 9 4 7-7 14H5l2-7-6-5 4-9-4-7L4 1Zm7 33h6l11-24h-6L11 34Zm19-24h6v19h4v5H30V10Zm13 0h14v6h-8v3h8v15H43v-6h8v-3h-8V10Z" fill="#151515"/>
  </g>

  <g font-family="Manrope, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="158" y="176" fill="#151515" font-size="68" font-weight="780" letter-spacing="-3.5">local-search</text>

    <text x="76" y="243" fill="#5F615C" font-size="25" font-weight="560" letter-spacing="-.6">Free structured web search for agents,</text>
    <text x="76" y="278" fill="#5F615C" font-size="25" font-weight="560" letter-spacing="-.6">powered by your local browser.</text>

    <rect x="76.5" y="330.5" width="500" height="64" rx="8" fill="#171717" stroke="#30302F"/>
    <text x="99" y="371" fill="#C9F1EF" font-size="18" font-weight="760">$</text>
    <text x="123" y="371" fill="#F7F8F5" font-size="18" font-weight="650">lsearch search "browser automation" --limit 3</text>

    <text x="76" y="440" fill="#0D6F74" font-size="21" font-weight="740">No API key. No metered search bill.</text>

    <path d="M76 477.5H576M242.5 477.5V535M409.5 477.5V535" stroke="#D7D7D1"/>
    <text x="76" y="510" fill="#151515" font-size="22" font-weight="780">54.3 KiB</text>
    <text x="76" y="531" fill="#6F6F69" font-size="9.5" font-weight="720" letter-spacing="1.3">CRATES.IO PACKAGE</text>
    <text x="265" y="510" fill="#0D6F74" font-size="22" font-weight="780">96.5%</text>
    <text x="265" y="531" fill="#6F6F69" font-size="9.5" font-weight="720" letter-spacing="1.3">LESS AGENT CONTEXT</text>
    <text x="432" y="510" fill="#151515" font-size="22" font-weight="780">$0</text>
    <text x="432" y="531" fill="#6F6F69" font-size="9.5" font-weight="720" letter-spacing="1.3">HOSTED API USAGE</text>
  </g>

  <g transform="translate(670 108)">
    <rect x="0.5" y="0.5" width="443" height="451" rx="11" fill="#FFFFFF" fill-opacity=".9" stroke="#CFCFC9"/>
    <rect x="1" y="1" width="442" height="50" rx="10" fill="#C9F1EF"/>
    <path d="M1 51.5H443" stroke="#B9DAD7"/>
    <circle cx="25" cy="26" r="4" fill="#168B90"/>
    <text x="38" y="31" fill="#0D6F74" font-family="Manrope, Inter, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing=".7">RETURNED TO THE AGENT</text>
    <text x="419" y="31" fill="#0D6F74" fill-opacity=".72" font-family="Manrope, Inter, Arial, sans-serif" font-size="11" font-weight="650" text-anchor="end">stdout · application/json</text>

    <g font-family="Manrope, Inter, Arial, sans-serif" font-size="15" font-weight="540">
      <text x="30" y="82" fill="#6F6F69">{</text>
      <text x="48" y="105"><tspan fill="#0D6F74">"ok"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515" font-weight="720">true</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="48" y="128"><tspan fill="#0D6F74">"query"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515">"browser automation"</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="48" y="151"><tspan fill="#0D6F74">"engine"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515">"duckduckgo"</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="48" y="174"><tspan fill="#0D6F74">"search"</tspan><tspan fill="#6F6F69">: {</tspan></text>
      <text x="66" y="197"><tspan fill="#0D6F74">"blocked"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515" font-weight="720">false</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="66" y="220"><tspan fill="#0D6F74">"results"</tspan><tspan fill="#6F6F69">: [</tspan></text>
      <text x="84" y="243" fill="#6F6F69">{</text>
      <text x="102" y="266"><tspan fill="#0D6F74">"rank"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515" font-weight="720">1</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="102" y="289"><tspan fill="#0D6F74">"title"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515">"Playwright"</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="102" y="312"><tspan fill="#0D6F74">"domain"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515">"playwright.dev"</tspan><tspan fill="#6F6F69">,</tspan></text>
      <text x="102" y="335"><tspan fill="#0D6F74">"snippet"</tspan><tspan fill="#6F6F69">: </tspan><tspan fill="#151515">"Fast browser…"</tspan></text>
      <text x="84" y="358" fill="#6F6F69">}</text>
      <text x="66" y="381" fill="#6F6F69">]</text>
      <text x="48" y="404" fill="#6F6F69">}</text>
      <text x="30" y="427" fill="#6F6F69">}</text>
    </g>
  </g>
</svg>
