<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-search · Search context benchmark</title>
<style>
@font-face{font-family:Manrope;src:url('./fonts/Manrope.ttf');font-weight:200 800;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#1a211d;color:#e5ebe5;font-family:Manrope,sans-serif}
main{width:1280px;min-height:720px;padding:34px 48px 28px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:40px}
h1{font-size:38px;letter-spacing:-1.5px;font-weight:650;margin:0 0 12px;line-height:1.2}
.subtitle{font-size:21px;color:#acb7ad;margin:0}
.scope{max-width:230px;text-align:right;font-size:19px;line-height:1.5;color:#acb7ad;padding-top:7px}
.axis,.row{display:grid;grid-template-columns:224px 1fr 160px;gap:24px;align-items:center;padding:0 22px}
.axis{margin:28px 0 14px;color:#acb7ad;font-size:18px}
.axis-scale{grid-column:2;display:flex;justify-content:space-between}
.row{height:84px;border-bottom:1px solid #36433a}
.row.local{background:#193d34;border:1px solid #366357;border-radius:7px;color:#79d9d6}
.name{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:600;letter-spacing:-.4px}
.logo{width:30px;height:30px;object-fit:contain;flex:none}
.logo[src$="tavily.svg"]{background:#fff;border-radius:5px}
.mark{width:34px;height:28px;flex:none}
.track{height:25px;background:#28322b}.bar{height:100%;background:#859c8c}
.local .track{background:#2a4c40}.local .bar{background:#58c6ca}
.value{font-size:30px;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.ratio{display:block;font-size:18px;font-weight:450;color:#acb7ad;margin-top:7px;white-space:nowrap}
.local .ratio{color:#79d9d6}
footer{border-left:2px solid #4a5c4e;margin-top:24px;padding-left:16px;color:#acb7ad;font-size:17px;line-height:1.65}
footer strong{color:#e5ebe5;font-weight:550}
@media(max-width:700px){
 main{width:100%;min-height:0;padding:26px 20px}header{display:block}
 h1{font-size:28px;letter-spacing:-1px}.subtitle{font-size:17px;line-height:1.5}
 .scope{text-align:left;max-width:none;font-size:16px;padding-top:14px}
 .axis{display:block;margin-top:20px;padding:0 12px;font-size:16px}
 .row{height:auto;min-height:110px;grid-template-columns:1fr auto;gap:12px;padding:16px 12px}
 .name{font-size:19px;gap:9px}.logo{width:25px;height:25px}.mark{width:29px;height:24px}
 .value{grid-row:1;grid-column:2;font-size:25px;text-align:right}.ratio{font-size:16px;margin-top:4px}
 .track{grid-row:2;grid-column:1/-1;height:20px}
 footer{font-size:16px;margin-top:22px}
}
</style>
</head>
<body><main>
<header><div><h1>Less context per result.</h1><p class="subtitle">Normalized tokens per result. Lower is better.</p></div><div class="scope" id="scope"></div></header>
<div class="axis" aria-hidden="true"><div class="axis-scale"><span>0</span><span id="axis-max"></span></div></div>
<div id="chart" role="list" aria-label="Median tokens per result, matched successful searches"></div>
<footer><strong>120-character snippets · Same JSON fields · local-search 0.2.0 / Bing</strong><br>September 29, 2026 · Shared successful subset of 24 requests per provider</footer>
</main>
<template id="brand"><svg class="mark" viewBox="0 0 64 44" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4 1h54l-2 7 7 5-4 9 4 7-7 14H5l2-7-6-5 4-9-4-7L4 1Zm7 33h6l11-24h-6L11 34Zm19-24h6v19h4v5H30V10Zm13 0h14v6h-8v3h8v15H43v-6h8v-3h-8V10Z"/></svg></template>
<script>
const july=new URLSearchParams(location.search).get('dataset')==='july';
const date=july?'2026-07-21':'2026-09-29';
fetch('../../benchmarks/results/search-comparison-'+date+'.json').then(r=>r.json()).then(async data=>{
 const step=july?100:10;
 const max=Math.ceil(Math.max(...data.providers.map(provider=>provider.tokens))/step)*step;
 const baseline=data.providers.find(provider=>provider.id==='lsearch').tokens;
 const logos={exa:'exa.svg',brave:'brave.svg',tavily:'tavily.svg',firecrawl:'firecrawl.png'};
 const chart=document.querySelector('#chart');
 document.querySelector('#axis-max').textContent=max+' tokens';
 for(const provider of data.providers){
  const local=provider.id==='lsearch';
  const row=document.createElement('div');row.className='row'+(local?' local':'');row.setAttribute('role','listitem');
  const name=document.createElement('div');name.className='name';
  if(local){name.append(document.querySelector('#brand').content.cloneNode(true));}
  else{const logo=document.createElement('img');logo.className='logo';logo.src='../../site/public/brand/'+logos[provider.id];logo.alt='';name.append(logo);}
  name.append(document.createTextNode(local?'local-search':provider.label));
  const track=document.createElement('div');track.className='track';track.setAttribute('aria-hidden','true');
  const bar=document.createElement('div');bar.className='bar';bar.style.width=(provider.tokens/max*100)+'%';track.append(bar);
  const value=document.createElement('div');value.className='value';value.textContent=provider.tokens.toFixed(1);
  const ratio=document.createElement('span');ratio.className='ratio';ratio.textContent=local?'Baseline':(provider.tokens/baseline).toFixed(1)+'× baseline';value.append(ratio);
  row.append(name,track,value);chart.append(row);
 }
 document.querySelector('#scope').textContent=july?data.scope:data.matched.length+' matched queries · 3 results each';
 if(july){
  const footer=document.querySelector('footer');
  footer.replaceChildren();
  const label=document.createElement('strong');label.textContent='Recorded July 21, 2026 · Provider-specific snippets and highlights';
  footer.append(label,document.createElement('br'),document.createTextNode(data.note));
 }
 await Promise.all(Array.from(document.images).map(image=>image.decode()));
 window.CHART_DATA=data;window.READY=true;
}).catch(()=>{document.querySelector('#chart').textContent='Benchmark data could not be loaded.';});
</script>
</body>
</html>
