<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-search · Search context benchmark</title>
<style>
@font-face{font-family:Manrope;src:url('./fonts/Manrope.ttf');font-weight:200 800;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#151515;font-family:Manrope,sans-serif}
main{width:1280px;min-height:720px;padding:32px 48px 28px}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#5e625c}
.brand{display:flex;align-items:center;gap:12px;font-size:25px;color:#151515;font-weight:700;letter-spacing:-.8px}
.mark{width:45px;height:32px;color:#0d6f74}
h1{font-size:58px;letter-spacing:-2.7px;font-weight:650;margin:25px 0 10px;line-height:1.15}
.subtitle{font-size:23px;color:#5e625c;margin:0 0 24px}
.columns,.row{display:grid;grid-template-columns:255px 1fr 95px;gap:24px;align-items:center}
.columns{font-size:18px;color:#5e625c;padding:0 18px 10px}
.columns span:last-child{text-align:right}
.row{min-height:64px;padding:10px 18px;border-top:1px solid #d7d7d1}
.row.local{background:#c9f1ef;border:0}
.name{font-size:24px;font-weight:550;letter-spacing:-.5px;line-height:1.25}.name small{display:block;font-size:17px;font-weight:450;color:#0d6f74}
.track{height:26px;background:#e7e8e2}.bar{height:100%;background:#929b91}
.local .track{background:#b6e5e3}.local .bar{background:#168b90}
.value{font-size:31px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.local .value{color:#0d6f74}
footer{border-top:1px solid #d7d7d1;margin-top:22px;padding-top:16px;color:#5e625c;font-size:18px;line-height:1.6}
footer strong{font-weight:650;color:#151515}
@media(max-width:700px){
 main{width:100%;min-height:0;padding:28px 22px}header{font-size:16px;gap:12px}.brand{font-size:20px}.mark{width:32px}
 h1{font-size:37px;letter-spacing:-1.5px;line-height:1.15;margin-top:28px}.subtitle{font-size:18px;line-height:1.5}
 .columns{display:block;padding:0 0 14px;font-size:16px}.columns span:first-child,.columns span:last-child{display:none}.row{grid-template-columns:1fr auto;gap:10px;padding:16px 12px}.name{font-size:21px}.name small{display:inline;margin-left:8px}.value{font-size:26px}
 .track{grid-row:2;grid-column:1/-1;height:22px}.value{grid-row:1;grid-column:2}footer{font-size:16px;margin-top:20px}
}
</style>
</head>
<body><main>
<header><div class="brand"><svg class="mark" viewBox="0 0 64 44" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4 1h54l-2 7 7 5-4 9 4 7-7 14H5l2-7-6-5 4-9-4-7L4 1Zm7 33h6l11-24h-6L11 34Zm19-24h6v19h4v5H30V10Zm13 0h14v6h-8v3h8v15H43v-6h8v-3h-8V10Z"/></svg>local-search</div><span>lsearch.dev</span></header>
<h1>Search with less context.</h1>
<p class="subtitle">Same queries. Same snippet cap. Smaller JSON.</p>
<div class="columns"><span>Search interface</span><span>Median tokens per result · lower is better</span><span>Tokens</span></div>
<div id="chart" role="list" aria-label="Median tokens per result, matched successful searches"></div>
<footer><strong id="scope"></strong><br>120-character snippet cap · Common JSON schema · September 29, 2026</footer>
</main>
<script>
fetch('../../benchmarks/results/search-comparison-2026-09-29.json').then(r=>r.json()).then(data=>{
 const max=80;
 const chart=document.querySelector('#chart');
 for(const provider of data.providers){
  const row=document.createElement('div');row.className='row'+(provider.id==='lsearch'?' local':'');row.setAttribute('role','listitem');
  const name=document.createElement('div');name.className='name';name.textContent=provider.id==='lsearch'?'local-search':provider.label;
  if(provider.id==='lsearch'){const sub=document.createElement('small');sub.textContent='0.2.0 · Bing';name.append(sub);}
  const track=document.createElement('div');track.className='track';track.setAttribute('aria-hidden','true');
  const bar=document.createElement('div');bar.className='bar';bar.style.width=(provider.tokens/max*100)+'%';track.append(bar);
  const value=document.createElement('div');value.className='value';value.textContent=provider.tokens.toFixed(1);
  row.append(name,track,value);chart.append(row);
 }
 document.querySelector('#scope').textContent=data.matched.length+' matched queries · 3 results each · Successful subset of a 24-request run';
 window.CHART_DATA=data;window.READY=true;
}).catch(()=>{document.querySelector('#chart').textContent='Benchmark data could not be loaded.';});
</script>
</body>
</html>
