<!doctype html>
<html lang="en"><meta charset="utf-8"><title>local-search launch media</title>
<style>
@font-face{font-family:Manrope;src:url('./fonts/Manrope.ttf');font-weight:200 800;font-display:block}
:root{--paper:#f5f5f2;--ink:#151515;--muted:#5e625c;--line:#d7d7d1;--teal:#168b90;--deep:#0d6f74;--soft:#c9f1ef}
*{box-sizing:border-box;font-variant-ligatures:none}body{margin:0;background:var(--paper);font-family:Manrope,sans-serif;color:var(--ink)}
.canvas{width:1200px;height:900px;padding:48px 56px 38px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;height:38px;font-size:25px;font-weight:650}.brand{display:flex;align-items:center;gap:14px}.logo{width:49px;height:34px;color:var(--teal)}.top small{font-size:23px;color:var(--muted);font-weight:500}
h1{font-size:72px;line-height:1.08;letter-spacing:-3.4px;font-weight:650;margin:42px 0 18px}h1 span{color:var(--deep)}
.dek{font-size:29px;line-height:1.5;color:var(--muted);margin:0 0 28px;max-width:1080px}
.footer{margin-top:auto;border-top:1px solid var(--line);padding-top:20px;font-size:23px;color:var(--muted);display:flex;justify-content:space-between;gap:24px}.footer strong{color:var(--deep);font-weight:650;white-space:nowrap}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:48px;position:relative;margin-top:10px}
.window{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white;height:412px;position:relative}
.window.dark{background:#171717;color:#f5f5f2;border-color:#343434}.bar{height:52px;border-bottom:1px solid var(--line);background:#eceee9;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}.dark .bar{background:#222924;border-color:#343e36;color:#bfcac1}
.lights{display:flex;gap:7px;position:absolute;left:19px}.lights i{width:10px;height:10px;border-radius:50%;background:#db7163}.lights i:nth-child(2){background:#e4b760}.lights i:nth-child(3){background:#70ae7a}
.body{padding:26px 26px 20px}.code{font-size:26px;line-height:1.62;overflow-wrap:anywhere;margin:0}.dark .code{color:#f3f5f1}.cyan{color:#84dedb}.green{color:var(--deep)}.dim{color:#aebbb1}.sub{font-size:24px;line-height:1.5;margin-top:28px}.status{position:absolute;bottom:0;left:0;right:0;padding:16px 24px;border-top:1px solid #343e36;font-size:23px;background:#222924;color:#84dedb}
.rail{position:absolute;top:50%;left:calc(50% - 24px);width:48px;border-top:2px dashed var(--teal);z-index:4}
.address{background:#eff2ed;border-radius:7px;padding:10px 15px;font-size:22px;color:var(--muted);margin-bottom:20px;overflow:hidden;white-space:nowrap}.result{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}.result:last-child{border:0;margin-bottom:0;padding-bottom:0}.result b{display:block;color:var(--deep);font-size:25px;line-height:1.2;font-weight:600}.result span{display:block;color:var(--muted);font-size:22px;line-height:1.2;margin-top:3px}.skeleton{height:13px;border-radius:4px;background:#e4e7e1;margin:18px 0}.skeleton:nth-child(2n){width:70%}.searchword{font-size:25px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.chips{display:flex;gap:14px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:25px;background:white}
.bigflow{margin-top:20px;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}.flowbox{height:282px;border:1px solid var(--line);border-radius:14px;padding:32px;background:white}.flowbox.dark{background:#171717;color:#f5f5f2}.flowbox h2{font-size:34px;line-height:1.3;letter-spacing:-1px;margin:10px 0 18px}.flowbox p{font-size:26px;line-height:1.5;color:var(--muted);margin:0}.flowbox.dark p{color:#bdc9c0}.bridge{border-top:2px dashed var(--teal)}.glyph{width:50px;height:50px;color:var(--teal)}
.strip{margin-top:32px;padding:21px 26px;background:var(--soft);color:var(--deep);font-size:27px;line-height:1.5;border-left:3px solid var(--teal)}.scene-connect .strip{margin-top:16px}.scene-read .strip{margin-top:12px;padding:16px 26px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:8px}.choice{border:1px solid var(--line);border-radius:14px;background:white;padding:26px}.choice.active{background:#e2f2ef;border-color:#93c5c0}.choice .glyph{width:36px;height:36px}.choice h2{font-size:32px;letter-spacing:-1px;line-height:1.25;margin:8px 0 14px}.choice p{font-size:26px;line-height:1.4;color:var(--muted);margin:0 0 18px}.choice .code{font-size:24px;border-top:1px solid var(--line);padding-top:18px;color:var(--deep);margin-bottom:0}
.label{font-size:24px;color:var(--deep);font-weight:650}.consent{margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:42px}.steps{font-size:28px;line-height:1.45;display:flex;flex-direction:column;gap:25px;padding-top:20px}.step{display:flex;gap:16px}.num{display:inline-flex;border:1px solid #80bdb9;border-radius:50%;width:40px;height:40px;align-items:center;justify-content:center;flex-shrink:0;font-size:23px;color:var(--deep)}
.permission{background:#171717;color:white;border-radius:14px;padding:28px;height:324px}.permission h2{font-size:30px;margin:0 0 20px}.permission p{font-size:26px;line-height:1.5;color:#bdc9c0;margin:0}.permission .allow{display:inline-block;background:var(--soft);color:var(--deep);padding:10px 26px;border-radius:7px;font-size:25px;margin-top:25px}.permission .badge{font-size:23px;margin-top:14px;color:#84dedb}
.scene-benchmark h1{font-size:64px;line-height:1.02;margin-top:28px;margin-bottom:12px}.scene-benchmark .dek{font-size:27px;margin-bottom:12px}.scene-benchmark .bars{margin-top:16px}.scene-benchmark .caveat{margin-top:20px}.scene-benchmark .method{margin-top:14px}.arg{white-space:nowrap}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:8px 0 0}.metric{border-top:1px solid var(--line);padding-top:23px}.metric h2{font-size:29px;letter-spacing:-.8px;margin:0 0 14px}.gain{font-size:70px;line-height:1.15;letter-spacing:-3px;color:var(--deep);font-weight:650}.gain small{font-size:26px;letter-spacing:-.4px;color:var(--muted);font-weight:500;margin-left:9px}.bars{margin-top:26px}.barlabel{display:flex;justify-content:space-between;font-size:24px;margin:16px 0 8px}.track{height:15px;background:#e6e8e1}.fill{height:100%;background:#8a9085}.fill.new{background:var(--teal)}.caveat{margin-top:27px;background:#e9ebe5;padding:19px 24px;font-size:25px;line-height:1.5}.method{font-size:23px;line-height:1.55;color:var(--muted);margin:20px 0 0}
.hero .dek{max-width:850px}.hero .flowbox{height:258px}.hero .chips{margin-top:30px}.outro h1{font-size:87px;margin-top:64px}.outro .install{background:#171717;border-radius:12px;padding:30px 34px;margin:30px 0;color:white;font-size:30px;line-height:1.75}.outro .install span{color:#84dedb}
.outro .dek{max-width:1000px}.screen[hidden]{display:none}.reticle{position:absolute;left:22px;top:22px;width:14px;height:14px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.portrait.canvas{width:1080px;height:1350px;padding:56px}.portrait .top small{display:none}.portrait .top{font-size:31px}.portrait h1{font-size:96px;margin-top:56px}.portrait .dek{font-size:37px;line-height:1.4;max-width:none}.portrait .bigflow{grid-template-columns:1fr;gap:0}.portrait .flowbox{height:230px;padding:26px 32px}.portrait .flowbox .glyph{float:right;width:56px;height:56px}.portrait .flowbox h2{font-size:41px;margin:0 0 16px}.portrait .flowbox p{font-size:35px;line-height:1.35}.portrait .flowbox p br{display:none}.portrait .bridge{height:36px;width:0;border:0;border-left:2px dashed var(--teal);justify-self:center}.portrait .chips{gap:16px;margin-top:30px}.portrait .chip{font-size:32px}.portrait .footer{font-size:28px}.portrait .metrics{grid-template-columns:1fr;gap:22px}.portrait .metric{padding-top:17px}.portrait .metric h2{font-size:34px;margin-bottom:6px}.portrait .gain{font-size:74px}.portrait .gain small{font-size:32px}.portrait .bars{margin-top:12px}.portrait .barlabel{font-size:28px;margin-top:12px}.portrait .caveat{font-size:29px;margin-top:24px}.portrait .method{font-size:26px;line-height:1.4;margin-top:18px}.portrait.scene-benchmark h1{font-size:82px;margin-top:36px}.portrait.scene-benchmark .dek{font-size:29px;margin-bottom:16px}
</style>
<main id="canvas" class="canvas"><div class="reticle"></div><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 64 44"><path fill="currentColor" fill-rule="evenodd" d="M4 1h54l-2 7 7 5-4 9 4 7-7 14H5l2-7-6-5 4-9-4-7L4 1Zm7 33h6l11-24h-6L11 34Zm19-24h6v19h4v5H30V10Zm13 0h14v6h-8v3h8v15H43v-6h8v-3h-8V10Z"/></svg>local-search</div><small id="topnote">A local browser API for agents</small></header><div id="content"></div><footer class="footer"><span id="note"></span><strong>lsearch.dev</strong></footer></main>
<script>
const glyph=(kind)=>`<svg class="glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${kind==='terminal'?'<rect x="4" y="8" width="40" height="32" rx="5"/><path d="m12 18 6 6-6 6m13 0h9"/>':kind==='browser'?'<rect x="4" y="6" width="40" height="36" rx="5"/><path d="M4 16h40M11 11h1m5 0h1"/><circle cx="24" cy="28" r="8"/><path d="M16 28h16m-8-8c-4 5-4 11 0 16m0-16c4 5 4 11 0 16"/>':'<path d="M15 8H9v32h6m18-32h6v32h-6M21 17l-6 7 6 7m6-14 6 7-6 7"/>'}</svg>`;
const win=(title,body,dark=false,status='')=>`<div class="window ${dark?'dark':''}"><div class="bar"><div class="lights"><i></i><i></i><i></i></div>${title}</div><div class="body">${body}</div>${status?`<div class="status">${status}</div>`:''}</div>`;
const command='<span class="cyan">$</span> lsearch "rust browser automation libraries" <span class="cyan arg">--engine duckduckgo</span> <span class="cyan arg">--limit 3</span> <span class="cyan arg">--json</span>';
const results='<div class="result"><b>browser_automation</b><span>lib.rs</span></div><div class="result"><b>BB-fat / browser-use-rs</b><span>github.com</span></div><div class="result"><b>Skyvern-AI / rustwright</b><span>github.com</span></div>';
const resultBrowser='<div class="address">duckduckgo.com</div>'+results;
const scenes={
hero:()=>({title:'Your agent.<br><span>Your browser.</span>',dek:'Let your agent search and read through Chrome on your machine.',body:`<div class="bigflow"><div class="flowbox dark">${glyph('terminal')}<h2>Your agent calls lsearch</h2><p>One command from any <br>shell-capable agent.</p></div><div class="bridge"></div><div class="flowbox">${glyph('browser')}<h2>Your browser does the work</h2><p>Use an approved session <br>or a separate profile.</p></div></div><div class="chips"><span class="chip">Search</span><span class="chip">Read</span><span class="chip">Extract</span><span class="chip">Interact</span></div>`,note:'Open source · Native Rust CLI',cls:'hero'}),
search:()=>({title:'One command.<br><span>Your local browser.</span>',dek:'The agent chooses an engine and asks for three results.',body:`<div class="panels">${win('local-search',`<p class="code">${command}</p>`,true,'Searching in your chosen browser') }<div class="rail"></div>${win('Local Chrome','<div class="address">duckduckgo.com</div><div class="searchword">rust browser automation libraries</div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>')}</div>`,note:'Illustrated workflow · Animation timing is illustrative'}),
results:()=>({title:'Useful results.<br><span>Compact JSON.</span>',dek:'Titles and source links come back to your agent.',body:`<div class="panels">${win('local-search','<p class="code dim" style="font-size:25px;line-height:1.5">{<br>&nbsp; <span class="cyan">"rank"</span>: 1,<br>&nbsp; <span class="cyan">"title"</span>: "browser_automation",<br>&nbsp; <span class="cyan">"domain"</span>: "lib.rs",<br>&nbsp; <span class="cyan">"url"</span>: "https://lib.rs/crates/browser_automation"<br>}</p>',true)}<div class="rail"></div>${win('Local Chrome',resultBrowser)}</div>`,note:'July 21, 2026 public results · Output excerpt; title shortened'}),
read:()=>({title:'Use the logins<br><span>you already have.</span>',dek:'Connect to your open Chrome, then read a signed-in page.',body:`<div class="panels">${win('local-search','<p class="code"><span class="cyan">$</span> lsearch connect --existing</p><p class="sub dim">Approve in Chrome once<br>for this connection.</p><p class="code" style="margin-top:26px"><span class="cyan">$</span> lsearch read<br>https://www.linkedin.com/feed/<br><span class="cyan">--format json</span></p>',true)}<div class="rail"></div>${win('Your existing Chrome','<div class="address">linkedin.com/feed</div><p style="font-size:30px;margin:25px 0 16px;color:var(--deep)">Your signed-in session</p><p style="font-size:27px;line-height:1.5;color:var(--muted);margin:0">The agent can read pages<br>your profile can access.</p><div class="strip" style="font-size:24px">Private content omitted.</div>')}</div>`,note:'Illustration · Chrome approval required · Sites control access'}),
choice:()=>({title:'Choose the browser<br><span>your agent uses.</span>',dek:'Keep your current logins, or give agent work its own profile.',body:`<div class="choices"><section class="choice active">${glyph('browser')}<h2>Your existing Chrome</h2><p>Use your signed-in sites.<br>Connect with Chrome approval.</p><p class="code">lsearch connect --existing</p></section><section class="choice">${glyph('terminal')}<h2>A separate profile</h2><p>Sign in once here.<br>Keep agent sessions separate.</p><p class="code">lsearch connect --managed</p></section></div><div class="strip">Choice saved. Commands fail if this browser disconnects.</div>`,note:'Existing Chrome: 144+ · Persistent helper: macOS/Linux'}),
connect:()=>({title:'Approve once.<br><span>Reuse the connection.</span>',dek:'The local helper keeps the approved Chrome session open.',body:`<div class="consent"><div class="steps"><div class="step"><span class="num">1</span>Enable remote debugging<br>in Chrome 144+.</div><div class="step"><span class="num">2</span>Run lsearch connect --existing.</div><div class="step"><span class="num">3</span>Approve Chrome’s prompt.</div></div><div class="permission"><h2>Chrome asks for approval</h2><p>This grants broad browser<br>control to a trusted agent.</p><span class="allow">Allow</span><div class="badge">Illustration of the approval step</div></div></div><div class="strip">Later commands reuse this connection on macOS/Linux.</div>`,note:'Use trusted agents · Approval is not per-action authorization'}),
disconnect:()=>({title:'Done for now?<br><span>Disconnect.</span>',dek:'End agent access through the helper. Leave Chrome open.',body:`<div class="bigflow"><div class="flowbox dark">${glyph('terminal')}<h2>End the connection</h2><p style="color:#84dedb">$ lsearch disconnect</p></div><div class="bridge" style="border-color:#b6bcb1"></div><div class="flowbox">${glyph('browser')}<h2>Keep browsing</h2><p>Your browser stays open.<br>Your logins stay there.</p></div></div><div class="strip">To reconnect, run connect and approve again.</div>`,note:'Persistent existing-browser helper · macOS/Linux'}),
outro:()=>({title:'Give your agent<br><span>a browser it can use.</span>',dek:'Search. Read pages. Work with your approved sessions.',body:'<div class="install"><span>$</span> cargo install local-search<br><small style="font-size:24px;color:#bdc9c0">or</small><br><span>$</span> npm install -g @kevinliu01/localsearch</div><div class="chips"><span class="chip">Claude Code</span><span class="chip">Codex</span><span class="chip">Cursor</span><span class="chip">OpenClaw</span></div>',note:'npm requires Rust/Cargo · Setup: lsearch.dev/docs',cls:'outro'}),
benchmark:()=>{const d=window.BENCHMARK.summary;const row=(name,key)=>{const a=d[key].baseline.latency_ms.median,b=d[key].candidate.latency_ms.median;return `<div class="metric"><h2>${name}</h2><div class="gain">${((1-b/a)*100).toFixed(0)}%<small>lower median</small></div><div class="bars"><div class="barlabel"><span>0.2.0 baseline</span><strong>${a.toFixed(1)} ms</strong></div><div class="track"><div class="fill" style="width:100%"></div></div><div class="barlabel"><span>Development build</span><strong>${b.toFixed(1)} ms</strong></div><div class="track"><div class="fill new" style="width:${b/a*100}%"></div></div></div></div>`};return {title:'Bing search.<br><span>Before and after.</span>',dek:'Bing search · 0.2.0 vs. the unreleased core redesign',body:`<div class="metrics">${row('Uncached search','search_cold')}${row('Cached search','search_cached')}</div><div class="caveat">Uncached p95 got slower: 294.1 → 328.2 ms.</div><p class="method">One query · 3 results · 20 samples per build and mode<br>Alternating A/B · Warm Chrome / OS · arm64 macOS</p>`,note:'Sep 25, 2026 (Pacific) · Evidence publication pending',top:'Development build · Unreleased'}}
};
window.showScene=(name,portrait=false)=>{const s=scenes[name]();document.getElementById('canvas').className='canvas scene-'+name+' '+(s.cls||'')+(portrait?' portrait':'');document.getElementById('content').innerHTML=`<h1>${s.title}</h1><p class="dek">${s.dek}</p>${s.body}`;document.getElementById('note').textContent=s.note;document.getElementById('topnote').textContent=s.top||'A local browser API for agents';return name};
fetch('../../benchmarks/results/local-ab-2026-09-25-bing-expanded.json').then(r=>r.json()).then(d=>{window.BENCHMARK=d;showScene(new URLSearchParams(location.search).get('scene')||'hero');window.READY=true});
</script></html>
